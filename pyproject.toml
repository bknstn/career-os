[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "career-os"
version = "0.1.0"
description = "Personal career intelligence system; foundation for the Market Explorer MVP."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
]
keywords = ["career", "job-market", "market-explorer"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Documentation = "https://github.com/bknstn/career-os#readme"
Architecture = "https://github.com/bknstn/career-os/blob/main/docs/adr/0001-market-explorer-foundation.md"

[tool.hatch.build.targets.wheel]
packages = ["src/career_os"]

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pre-commit>=4.2",
    "pytest>=8.4",
    "ruff>=0.12",
    "types-PyYAML>=6.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
files = ["src"]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
