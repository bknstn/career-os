<!doctype html>

    <div class="app-shell">

          <span><strong>career</strong><span class="brand-light">radar</span><small>Jobs, roles &amp; skills</small></span>
        </a>
        <p class="nav-label">Workspace</p>
        <nav class="primary-nav">
          <a href="#/overview" data-nav="overview"><span class="nav-icon" aria-hidden="true">◫</span> Overview</a>
          <a href="#/explore" data-nav="explore"><span class="nav-icon" aria-hidden="true">⌕</span> Jobs</a>
          <a href="#/saved" data-nav="saved"><span class="nav-icon" aria-hidden="true">♡</span> Saved <span class="saved-count" id="saved-count">0</span></a>

        </header>
        <main id="main" tabindex="-1">
          <div id="app" class="page-wrap" aria-live="polite" aria-busy="false"></div>

        <footer class="footer">
          <span>Career Radar · Research tool</span>
