ambiguous_alias_rules:
  - skill_id: go
    alias: Go
    positive_context_patterns:
      - "\\bGo\\s+(developer|service|runtime|language|programming|codebase)\\b"
      - "\\b(experience|proficiency|familiarity|knowledge|programming|written|implemented|write|work|working)\\b[^\\n.;]{0,80}\\bGo\\b"
      - "\\bGo\\b[^\\n.;]{0,80}\\b(based|services?|code|codebase|development|proficiency|experience)\\b"
      - "\\bGo\\b\\s*(,|/|and/or|or)\\s*(Python|Rust|Java|Ruby|C\\+\\+|C#|TypeScript)\\b"
      - "\\bGolang\\b"
    negative_patterns: ["\\bgo\\s+to\\b", "\\bgo-to\\b", "\\bgo\\s+live\\b"]
  - skill_id: r
    alias: R
    positive_context_patterns: ["\\bR\\s+(language|programming|developer|statistics)\\b", "\\bRStudio\\b"]
    negative_patterns: ["\\bR&D\\b", "\\bR\\s*\\+"]
  - skill_id: c
    alias: C
    positive_context_patterns: ['\bC\s+(language|programming|developer)\b', '\bC/C\+\+\b']
    negative_patterns: ['\bC-suite\b', '\bgrade\s+C\b']
