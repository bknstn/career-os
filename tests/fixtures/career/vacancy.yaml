  source_text: 'Staff Software Engineer, Speciality PUDO

    Warsaw, Poland


    Waymo is an autonomous driving technology company with the mission to be the world''s
    most trusted driver. Since its start as the Google Self-Driving Car Project in
    2009, Waymo has focused on building the Waymo Driver—The World''s Most Experienced
    DriverTM—to improve access to mobility while saving thousands of lives now lost
    to traffic crashes. The Waymo Driver powers Waymo’s fully autonomous ride-hail
    service and can also be applied to a range of vehicle platforms and product use
    cases. The Waymo Driver has provided over ten million rider-only trips, enabled
    by its experience autonomously driving over 100 million miles on public roads
    and tens of billions in simulation across 15+ U.S. states.


    Software Engineering builds the brains of Waymo''s fully autonomous driving technology.
    Our software allows the Waymo Driver to perceive the world around it, make the
    right decision for every situation, and deliver people safely to their destinations.
    We think deeply and solve complex technical challenges in areas like robotics,
    perception, decision-making and deep learning, while collaborating with hardware
    and systems engineers. If you’re a software engineer or researcher who’s curious
    and passionate about Level 4 autonomous driving, we''d like to meet you.


    We are looking for a passionate Backend Software Engineer to enhance the rider
    experience and develop systems for understanding our operational environment.
    Your work will involve both refining the in-app experience, especially in complex
    venues like airports, and building a platform to collect and analyze city health
    data, generating crucial insights for internal teams and external partners.

    You will be developing high-quality, reliable, and scalable backend systems that
    form the backbone of mission-critical Waymo infrastructure, enabling new functionalities,
    supporting expansion into new markets, and providing data-driven intelligence.


    You will:


    • Lead the design and development of high-impact backend systems and APIs crucial
    for Waymo''s rider experience and operational intelligence.


    • Architect and implement scalable platforms to ingest, process, and analyze city
    and vehicle data, generating key insights.


    • Drive the technical vision and roadmap for backend services that support seamless
    rider journeys, especially in complex venues.


    • Build and maintain robust, mission-critical infrastructure to support Waymo''s
    expanding autonomous vehicle operations.


    • Collaborate across engineering, product, and operations teams to deliver innovative
    solutions for our riders and internal tools.


    • Mentor other engineers, championing best practices in software design, testing,
    and reliability.


    • Own the end-to-end delivery of complex features, from conception through production
    deployment and beyond.


    • Enhance system performance and scalability to ensure highly reliable service
    for our autonomous fleet.


    You have:


    • Bachelor’s degree or equivalent practical experience.


    • 8 years of experience in backend development, across back-end such as Java/Kotlin,
    Python, Go, or C++ codebases.


    • Experience with designing and developing distributed systems.


    • Experience collaborating with other software developers and cross-functional
    stakeholders at multiple levels and across sites.


    • Experience in leading large efforts and a team of engineers.


    • Excellent communication and collaboration skills.


    We prefer:


    • Experience with engineering artifacts, reliability monitoring and alerting,
    security and privacy practices and techniques, documentation, integration testing,
    production hygiene, and support processes.


    • Experience with large scale distributed systems.


    • Proficiency in c++.


    • Experience in leading teams of engineers.


    #LI-Hybrid'
